<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Harbour Lights chart editor</title>
    <style>
      body { margin: 0; font: 14px system-ui, sans-serif; background: #1b043b; color: #fff; display: flex; gap: 18px; padding: 16px; flex-wrap: wrap; }
      canvas { background: #0b1a3a; border-radius: 10px; cursor: crosshair; }
      .panel { display: flex; flex-direction: column; gap: 10px; width: 340px; }
      button, select { font: inherit; padding: 6px 12px; border-radius: 999px; border: 0; background: #5b33a0; color: #fff; font-weight: 700; cursor: pointer; }
      button.on { background: #06ffff; color: #1b043b; }
      pre { white-space: pre-wrap; font-size: 12px; background: #0004; padding: 8px; border-radius: 8px; margin: 0; }
      textarea { width: 100%; height: 160px; background: #0004; color: #fff; border-radius: 8px; border: 1px solid #ffffff33; font: 11px monospace; }
    </style>
  </head>
  <body>
    <canvas id="c" width="432" height="648"></canvas>
    <div class="panel">
      <h2 style="margin:0">Chart editor</h2>
      <label>Chart <select id="chart"><option value="bay">Home Bay</option><option value="skerries">The Skerries</option></select></label>
      <div id="tools"></div>
      <div style="font-size:12px;color:#d0c8df">Click to place the selected item. Mouse wheel over a rock resizes it. Right-click deletes. Green squares are safe; brighter means nearer the harbour.</div>
      <label><input type="checkbox" id="grid" checked /> Show the safe-route grid</label>
      <div>Run night <input id="night" type="number" min="1" max="40" value="1" style="width:56px" /> <button id="run">Run with the keeper</button> <button id="stop">Stop</button></div>
      <button id="check">Check every edge start (kept lit)</button>
      <pre id="report"></pre>
      <textarea id="json"></textarea>
    </div>
    <script type="module" src="./editor.ts"></script>
  </body>
</html>
