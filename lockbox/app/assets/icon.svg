<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx=".5" cy=".38" r=".75">
      <stop offset="0" stop-color="#5b33a0"/>
      <stop offset=".6" stop-color="#2a0b5a"/>
      <stop offset="1" stop-color="#1b043b"/>
    </radialGradient>
    <radialGradient id="light" cx=".5" cy="1" r=".9">
      <stop offset="0" stop-color="#fff6c8" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#ffd166" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset=".55" stop-color="#d4a64a"/>
      <stop offset="1" stop-color="#8a5a18"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" x2="1">
      <stop offset="0" stop-color="#8b8fa0"/>
      <stop offset=".5" stop-color="#f1f2f7"/>
      <stop offset="1" stop-color="#7c8090"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- light from the chest -->
  <path d="M250 520 L120 120 L904 120 L774 520 Z" fill="url(#light)"/>
  <!-- chest body -->
  <rect x="222" y="500" width="580" height="330" rx="34" fill="#7a4520" stroke="#3a1a08" stroke-width="16"/>
  <line x1="236" x2="788" y1="610" y2="610" stroke="#3a1a08" stroke-width="8" opacity=".5"/>
  <line x1="236" x2="788" y1="710" y2="710" stroke="#3a1a08" stroke-width="8" opacity=".5"/>
  <rect x="222" y="500" width="62" height="330" fill="#f2c14e" stroke="#3a1a08" stroke-width="12"/>
  <rect x="740" y="500" width="62" height="330" fill="#f2c14e" stroke="#3a1a08" stroke-width="12"/>
  <!-- lid, lifted -->
  <g transform="translate(0 -60) rotate(-6 222 470)">
    <path d="M222 480 V390 Q222 270 512 270 Q802 270 802 390 V480 Z" fill="#7a4520" stroke="#3a1a08" stroke-width="16"/>
    <rect x="206" y="456" width="612" height="36" rx="10" fill="#f2c14e" stroke="#3a1a08" stroke-width="12"/>
  </g>
  <!-- padlock -->
  <path d="M432 640 V560 a80 80 0 0 1 160 0 V600" fill="none" stroke="url(#steel)" stroke-width="40" stroke-linecap="round"/>
  <rect x="392" y="620" width="240" height="200" rx="40" fill="url(#brass)" stroke="#5a3a0a" stroke-width="14"/>
  <circle cx="512" cy="700" r="26" fill="#3a2410"/>
  <path d="M500 712 L524 712 L532 770 L492 770 Z" fill="#3a2410"/>
</svg>
