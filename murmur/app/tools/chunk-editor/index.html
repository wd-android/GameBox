<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Murmur chunk editor</title>
    <style>
      body { margin: 0; font: 14px system-ui, sans-serif; background: #1b043b; color: #fff; display: flex; gap: 18px; padding: 16px; flex-wrap: wrap; }
      canvas { background: linear-gradient(0deg, #ff7a2f, #9259fe 60%, #1b043b); border-radius: 10px; cursor: crosshair; }
      .panel { display: flex; flex-direction: column; gap: 10px; width: 340px; }
      button { font: inherit; padding: 6px 12px; border-radius: 999px; border: 0; background: #5b33a0; color: #fff; font-weight: 700; cursor: pointer; }
      button.on { background: #06ffff; color: #1b043b; }
      pre { white-space: pre-wrap; font-size: 12px; background: #0004; padding: 8px; border-radius: 8px; margin: 0; }
      textarea { width: 100%; height: 110px; background: #0004; color: #fff; border-radius: 8px; border: 1px solid #ffffff33; font: 11px monospace; }
    </style>
  </head>
  <body>
    <canvas id="c" width="360" height="600"></canvas>
    <div class="panel">
      <h2 style="margin:0">Chunk editor</h2>
      <div id="tools"></div>
      <div style="font-size:12px;color:#d0c8df">Click to place. Mouse wheel over an item resizes it (cloud radius, wire gap, thermal height). Right-click deletes.</div>
      <label>Tier <select id="tier"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label>
      <label>Load chunk <select id="pick"></select></label>
      <div><button id="fly">Fly through</button> <button id="clear">Clear</button> <button id="save">Save</button> <button id="load">Load</button></div>
      <pre id="report"></pre>
      <textarea id="json"></textarea>
    </div>
    <script type="module" src="./editor.ts"></script>
  </body>
</html>
